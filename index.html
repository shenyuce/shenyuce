<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172338">
  <title>神预测 · 研判中心</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { background: #f5f3ee; font: 14px/1.4 system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    header { height: 44px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      color: #f8f3e7; background: #172338; }
    .brand { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 700; letter-spacing: .03em; }
    .open { flex: none; color: #ead29a; text-decoration: none; font-size: 13px; }
    .open:focus-visible { outline: 2px solid #ead29a; outline-offset: 3px; }
    iframe { display: block; width: 100%; height: calc(100vh - 44px); height: calc(100dvh - 44px); border: 0; background: #f5f3ee; }
  </style>
</head>
<body>
  <header>
    <span class="brand">神预测 · 研判中心</span>
    <a class="open" id="open-site" href="https://feichang.shenyuce.net/h5/" target="_blank" rel="noopener noreferrer">独立打开 ↗</a>
  </header>
  <iframe id="site" title="神预测研判中心" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    (function () {
      var defaultCode = '1e3e1a8afe9d3bba8b11532a8f3966d9';
      var suppliedCode = new URLSearchParams(location.search).get('c') || '';
      var code = /^[a-f0-9]{32}$/i.test(suppliedCode) ? suppliedCode.toLowerCase() : defaultCode;
      var destination = 'https://feichang.shenyuce.net/go/?c=' + encodeURIComponent(code);
      document.getElementById('site').src = destination;
      document.getElementById('open-site').href = destination;
    }());
  </script>
</body>
</html>
