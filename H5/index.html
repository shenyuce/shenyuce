<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172338">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src https://feichang.shenyuce.net; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>知料知了 · 商户主页</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { background: #f5f3ee; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; background: #f5f3ee; }
    .gate { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      color: #f8f3e7; background: radial-gradient(circle at 50% 0, #284367 0, #172338 48%, #0b1423 100%); }
    .gate[hidden] { display: none; }
    .gate p { margin: 0; padding: 30px 34px; border: 1px solid #b99a60; border-radius: 18px;
      font-size: 18px; text-align: center; }
  </style>
</head>
<body>
  <main class="gate" id="gate" hidden><p>正在进入商户页面</p></main>
  <noscript>请启用 JavaScript 后访问。</noscript>
  <script>
    (function () {
      'use strict';
      var appOrigin = 'https://feichang.shenyuce.net';
      var params = new URLSearchParams(window.location.search);
      var rawCode = params.get('C') || params.get('c') || '';
      var code = rawCode.trim().toLowerCase();
      var gate = document.getElementById('gate');
      function show(message) {
        gate.querySelector('p').textContent = message;
        gate.hidden = false;
      }
      if (rawCode && !/^[a-f0-9]{32}$/.test(code)) {
        show('商家码无效，请重新扫码。');
        return;
      }
      var frame = document.createElement('iframe');
      frame.title = '知料知了商户主页';
      frame.referrerPolicy = 'strict-origin-when-cross-origin';
      frame.src = code
        ? appOrigin + '/api/promotion/open?code=' + encodeURIComponent(code)
        : appOrigin + '/h5/?v=20261007-member-grid#/pages/index/index';
      document.body.appendChild(frame);
    }());
  </script>
</body>
</html>
